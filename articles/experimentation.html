    <main>
      <section>Just trying things out, this is not for public consumption.</section>
      <section>
        <h2 id="experiment">
          <a class="anchor" href="#experiment"></a>
          <span>Experiment</span>
        </h2>
        <figure id="experiment-grid" class="full-width">
          <!-- <svg-box v-for="bbox of [new BBox(0,0,1000,600)]" :bbox="bbox"> -->
          <svg-box :bbox="bbox">
            <path :d="smallerBBox.d()" :style="{stroke: 'pink', fill: 'none'}"> </path>

            <template v-for="curve in curves">
              <path :d="curve.d()" :style="{stroke: 'black', fill: 'none'}"></path>

              <template
                v-for="annot of [curve.curve.debugCounterClockwisePoints(), ...curve.minus.map((c)=>c.curve.debugCounterClockwisePoints())]"
              >
                <path v-for="tangent of annot.tangents" :d="tangent.d()" :style="{stroke: 'red'}">
                </path>
                <path
                  v-for="tangent of annot.tangentPerps"
                  :d="tangent.d()"
                  :style="{stroke: 'blue'}"
                >
                </path>
                <!-- <path
                  v-for="contour of annot.contours"
                  :d="contour.d()"
                  :style="{stroke: 'orange', fill: 'none'}"
                >
                </path> -->
              </template>
            </template>
            <template v-for="curve of clippedCurves">
              <path
                v-for="answer of curve.bits"
                :d="answer.d()"
                :style="{stroke: 'purple', fill: 'none', 'stroke-width': 10}"
              ></path>
              <path
                v-for="answer of curve.clipped"
                :d="answer.d()"
                :style="{stroke: 'red', fill: 'none' ,'stroke-width': 10}"
              ></path>
              <path
                v-for="answer of curve.components"
                :d="answer.d()"
                :style="{stroke: 'cyan', fill: 'none'}"
              ></path>
              <!-- <circle
                v-for="pt in curve.allpoints.map((pt)=> this.bbox.at(pt[0]))"
                v-bind="pt.cxcyProps()"
                r="50"
                :style="{stroke: 'blue', fill:'none'}"
              >
              </circle> -->
              <path
                v-for="answer of curve.closed"
                :d="answer.d()"
                :style="{stroke: 'yellow', fill: 'none'}"
              ></path>
              <path
                v-for="answer of curve.answer"
                :d="answer.d()"
                :style="{stroke: 'green', fill: 'none'}"
              ></path>

              <!-- <template v-for="line in curve.fillDebug(3, angle)">
                <path
                  v-if="showFullLines"
                  v-for="l in bbox.clipLine(line.line)"
                  :d="l.d()"
                  :style="{stroke:'yellow'}"
                ></path>
                <path v-for="line in line.linelines" :d="line.d()" :style="{stroke:'red'}"></path>
                <circle
                  v-if="showPoints"
                  v-for="pt in line.points"
                  v-bind="pt.cxcyProps()"
                  r="2"
                  :style="{stroke: 'green'}"
                >
                </circle> 
                <circle
                  v-if="showTangentPoints"
                  v-for="pt in line.intersections"
                  v-bind="pt.cxcyProps()"
                  r="1"
                  :style="{stroke: 'blue', fill:'none'}"
                >
                </circle>
              </template> -->
            </template>
            <path :d="specialSegment.d()" :style="{stroke: 'pink', fill: 'none'}"></path>
            <path
              v-for="curve of flat"
              :d="curve.d()"
              :style="{stroke: 'black', fill: 'none'}"
            ></path>
            <circle
              v-for="pt in specialPoints"
              v-bind="pt.cxcyProps()"
              r="10"
              :style="{stroke: 'blue', 'stroke-width': 10, fill:'none'}"
            >
            </circle>
            <path
              v-for="curve of bboxes"
              :d="curve.d()"
              :style="{stroke: 'black', fill: 'none'}"
            ></path>
          </svg-box>
        </figure>
      </section>
