<!doctype html>
<html lang="en">
  <head>
    <title>List of Fonts</title>
    <!-- <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> -->
    <script src="/js/vue.js"></script>
    <link href="/style.css" rel="stylesheet" />
    <!-- <link href="triangles.css" rel="stylesheet" /> -->
    <link href="plot-generator.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Math&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>List of Fonts</h1>
      <div class="subhead"><a href="/index.html">Home</a></div>
    </header>
    <main>
      <section>
        <p>Here is a list of available SVG fonts.</p>
      </section>
      <section>
        <div id="plot">
          <div v-for="font in fonts" :style="{border: '1px solid black', 'border-radius': '10px'}">
            <figure>
              <svg-box v-for="bbox of [new BBox(0,0,1500,300)]" :bbox="bbox">
                <svg-text :text="text" :font="font" :size="50" :bbox="bbox"> </svg-text>
              </svg-box>
              <figcaption>{{font.name}}</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p>No LLMs were consulted in the making of this site.</p>
      <p>© 2026 Jānis Lībeks</p>
    </footer>
    <script type="module">
      const { createApp, ref, defineComponent } = Vue
      import { BBox, svgBox } from '/js/bbox.js'
      import { fonts } from '/js/text/allFonts.js'
      import { svgText } from '/js/text/text.js'

      const fontApp = createApp({
        data() {
          return {
            text: '0123456789!"#$%&\'()*+,-./:;<=>?@[\\]^_{|}~ `"', // '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ\nabcdefghijklmnopqrstuvwxyz',
          }
        },
        computed: {
          fonts() {
            let processedFonts = {}
            for (let key of Object.keys(fonts)) {
              processedFonts[key] = fonts[key]()
            }
            return processedFonts
          },
        },
        methods: {
          BBox,
        },
        components: {
          svgText,
          svgBox,
        },
      }).mount('#plot')
    </script>
  </body>
</html>
