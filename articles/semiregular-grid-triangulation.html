<!doctype html>
<html lang="en">
  <head>
    <title>Semiregular Grid Triangulation</title>
    <!-- <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> -->
    <script src="/js/vue.js"></script>
    <link href="/style.css" rel="stylesheet" />
    <link href="triangles.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Math&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Semiregular Grid Triangulation</h1>
      <div class="subhead"><a href="/index.html">Home</a></div>
    </header>
    <main>
      <section>
        This is a follow-up to <a href="/articles/semiregular-grids.html">Semiregular Grids</a>, as
        well as the
        <a href="/articles/catalan.html#polygon-triangulation">Polygon Triangulation</a> articles.
        Let's combine the two!
      </section>
      <section>
        <h2 id="triangulation-grids">
          <a class="anchor" href="#triangulation-grids"></a>
          <span>Triangulation grids</span>
        </h2>
        <figure id="grid" class="full-width">
          <svg viewBox="0 0 1000 500">
            <generic-triangulation-grid
              :bbox="bbox"
              :start="start"
              :size="60"
              :pattern="tiling"
              :iterations="-1"
            ></generic-triangulation-grid>
          </svg>
          <figcaption>
            <select v-model="tiling">
              <option disabled value="">Pick a tiling</option>
              <template v-for="(list, key) of tilingClasses">
                <option disabled value="">{{key}}</option>
                <option v-for="tile in list" :value="tile">{{tile.string()}}</option>
              </template>
            </select>
          </figcaption>
        </figure>
      </section>
      <section>
        <h2 id="further-ideas">
          <a class="anchor" href="#further-ideas"></a>
          <span>Further ideas to explore</span>
        </h2>
        <ul></ul>
      </section>
    </main>
    <footer>
      <p>No LLMs were consulted in the making of this site.</p>
      <p>© 2026 Jānis Lībeks</p>
    </footer>

    <script type="module">
      const { createApp, ref, defineComponent } = Vue
      import {
        VertexGrid,
        TilingPattern,
        regularTilings,
        semiregularTilings,
        uniform2Tilings,
        uniform3Tilings,
        uniform4Tilings,
        gridTiling,
      } from '/js/grid.js'
      import { toTransform } from '/js/svg-utils.js'
      import { BBox } from '/js/bbox.js'
      import { Point2DOrigin, Point, NGon } from '/js/geometry.js'
      import { degToRad } from '/js/math.js'
      import { playControls, radioButtons, toggleButton } from '/js/buttons.js'
      import { genericTriangulationGrid } from '/js/regular-truchet.js'
      import { numericalToHex } from '/js/catalan.js'

      createApp({
        data() {
          return {
            tiling: uniform4Tilings[7],
            start: new Point(500, 250),
            bbox: new BBox(-200, -100, 1200, 600),
            tilingClasses: {
              Regular: regularTilings,
              Semiregular: semiregularTilings,
              '2-uniform': uniform2Tilings,
              '3-uniform': uniform3Tilings,
              '4-uniform': uniform4Tilings,
            },
          }
        },
        methods: {
          toTransform,
          BBox,
          Point,
        },
        computed: {},
        components: { genericTriangulationGrid, toggleButton, radioButtons },
      }).mount('#grid')
    </script>
  </body>
</html>
